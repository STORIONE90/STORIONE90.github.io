<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Remote for Spotify</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #000; color: #fff; font-family: -apple-system, system-ui, sans-serif; text-align: center; }
  main { padding: 24px; max-width: 420px; }
  .dot { width: 64px; height: 64px; border-radius: 50%; background: #3BE477; margin: 0 auto 24px; }
  h1 { font-size: 28px; margin: 0 0 12px; }
  p { color: #b8b8b8; font-size: 18px; line-height: 1.4; margin: 0; }
</style>
</head>
<body>
<main>
  <div class="dot"></div>
  <h1 id="t">Sign-in complete</h1>
  <p id="s">You can close this page and go back to your watch.</p>
</main>
<script>
  (function () {
    var texts = {
      it: ["Accesso completato", "Puoi chiudere questa pagina e tornare all'orologio."],
      es: ["Acceso completado", "Puedes cerrar esta página y volver al reloj."],
      fr: ["Connexion réussie", "Vous pouvez fermer cette page et revenir à la montre."],
      de: ["Anmeldung abgeschlossen", "Du kannst diese Seite schließen und zur Uhr zurückkehren."],
      pt: ["Acesso concluído", "Pode fechar esta página e voltar ao relógio."],
      nl: ["Inloggen voltooid", "Je kunt deze pagina sluiten en teruggaan naar je horloge."]
    };
    var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
    var t = texts[lang];
    if (t) {
      document.documentElement.lang = lang;
      document.getElementById("t").textContent = t[0];
      document.getElementById("s").textContent = t[1];
    }
  })();
</script>
</body>
</html>
